{% load widget_tweaks %}

<h1 class="mt-8 mb-4 text-white prose prose-2xl">
    Create Transaction
</h1>

<form hx-post="{% url 'create-transaction' %}" >

    {% include 'tracker/partials/transaction-form.html' %}

    <button class="btn btn-success me-5">
        Add
    </button>
    <button class="btn btn-error"
    hx-get="{% url 'transactions-list' %}"
    hx-target="#transaction-block"
    hx-push-url="true">
        Cancel
    </button>
</form>
